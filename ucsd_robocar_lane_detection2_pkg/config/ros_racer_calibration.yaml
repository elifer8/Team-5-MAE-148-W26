lane_guidance_node:
  ros__parameters:
    Kp_steering : 0.35
    Ki_steering : 0.0
    Kd_steering : 0.1
    zero_throttle  : 0.0
    max_throttle : 0.28
    min_throttle : 0.24
    error_threshold : 0.18
    max_right_steering : 1.0
    max_left_steering : -1.0
    cmd_vel_output_topic : /cmd_vel_nav
    lane_mode : center
    lane_mode_topic : /lane_mode
    left_lane_target_error : 0.2
    right_lane_target_error : -0.2
    avoidance_cmd_topic : /avoidance_cmd
    avoidance_throttle : 0.28
    avoidance_left_steering : 0.45
    avoidance_right_steering : -0.45
    avoidance_left_duration : 1.0
    avoidance_right_duration : 1.0
    cone_distance_topic : /cone_distance_m
    cone_avoidance_enabled : true
    cone_trigger_distance_m : 2.0
    cone_reset_distance_m : 2.5
traffic_light_detector_node:
  ros__parameters:
    camera_topic : /camera/color/image_raw
    depth_topic : /camera/depth/image_raw
    traffic_light_state_topic : /traffic_light/state
    traffic_light_distance_topic : /traffic_light/distance_m
    inference_server_url : http://localhost:9001
    roboflow_model_id : traffic-light-training/6
    api_key : 'UOi4p4RmZsJV6kqNi8ln'
    image_path : /tmp/traffic_light_detector.jpg
    frame_skip : 1
    confidence_threshold : 0.5
    log_interval_sec : 1.0
    state_hold_sec : 0.5
    max_depth_age_sec : 0.2
    depth_roi_scale : 2.5
    min_depth_roi_size_px : 18
    depth_percentile : 20.0
    max_distance_m : 10.0
traffic_light_gate_node:
  ros__parameters:
    input_cmd_topic : /cmd_vel_nav
    output_cmd_topic : /cmd_vel
    traffic_light_state_topic : /traffic_light/state
    traffic_light_distance_topic : /traffic_light/distance_m
    stop_on_yellow : false
    stop_distance_m : 4.0
    distance_tolerance_m : 0.0
    distance_timeout_sec : 1.0
oakd_shared_node:
